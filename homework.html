<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดการบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fb; --paper:#ffffff; --ink:#1f2a44; --muted:#6b7794; --line:#d9e1f0;
  --accent:#2f5bea; --accent-ink:#fff; --done:#8a96b3; --late:#d6453d; --soon:#e08a00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121826;--paper:#1c2438;--ink:#e8edf8;--muted:#98a4c2;--line:#2c3752;--accent:#6c8cff;--accent-ink:#0f1730;--done:#6a7694;--late:#ff7a70;--soon:#ffb547}
}
:root[data-theme="dark"]{--bg:#121826;--paper:#1c2438;--ink:#e8edf8;--muted:#98a4c2;--line:#2c3752;--accent:#6c8cff;--accent-ink:#0f1730;--done:#6a7694;--late:#ff7a70;--soon:#ffb547}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1{font-family:'Mali','Sarabun',sans-serif;font-size:28px;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.filters button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;font:inherit;font-weight:500;white-space:nowrap;padding:0 14px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--subj,var(--accent));border-radius:14px;padding:12px 12px 12px 10px;display:flex;gap:10px;align-items:flex-start}
li.done{opacity:.6}
li.done .t{text-decoration:line-through;color:var(--done)}
.chk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--accent-ink);font-size:22px;display:grid;place-items:center;padding:0}
li.done .chk{background:var(--accent);border-color:var(--accent)}
.body{flex:1;min-width:0}
.subj{font-weight:700;font-size:14px;color:var(--subj,var(--accent))}
.t{font-size:18px;font-weight:500;word-break:break-word}
.n{color:var(--muted);font-size:15px;margin-top:2px;word-break:break-word}
.due{font-size:14px;margin-top:4px;color:var(--muted)}
.due.late{color:var(--late);font-weight:700}
.due.soon{color:var(--soon);font-weight:700}
.del{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:20px;border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font:700 18px 'Sarabun',sans-serif;box-shadow:0 6px 18px rgba(30,60,160,.35)}
dialog{border:0;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0}
dialog::backdrop{background:rgba(10,15,30,.5)}
label{display:block;font-weight:700;font-size:15px;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;min-height:50px;border-radius:12px;font:700 17px 'Sarabun',sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>สมุดการบ้าน</h1>
  <p class="sub" id="sum"></p>
  <div class="filters" role="group" aria-label="กรองรายการ">
    <button data-f="todo" aria-pressed="true">ยังไม่เสร็จ</button>
    <button data-f="done" aria-pressed="false">เสร็จแล้ว</button>
    <button data-f="all" aria-pressed="false">ทั้งหมด</button>
  </div>
  <ul id="list"></ul>
</main>
<button class="fab" id="add">+ เพิ่มการบ้าน</button>

<dialog id="dlg">
  <div id="formWrap">
    <label for="subj">วิชา (ไม่ต้องกรอกก็ได้)</label>
    <input id="subj" placeholder="เช่น คณิตศาสตร์" maxlength="40">
    <label for="title">การบ้าน</label>
    <input id="title" placeholder="เช่น แบบฝึกหัดหน้า 45" maxlength="120">
    <label for="due">วันที่ต้องส่ง (ไม่ต้องเลือกก็ได้)</label>
    <input id="due" type="date">
    <label for="note">บันทึกเพิ่มเติม</label>
    <textarea id="note" maxlength="300"></textarea>
    <div class="row">
      <button id="cancel" type="button">ยกเลิก</button>
      <button id="save" type="button" class="go">บันทึก</button>
    </div>
  </div>
</dialog>

<script>
(function(){
  var KEY='homework-v1', items=[], filter='todo';
  var COLORS=['#2f5bea','#d6453d','#1f9d6b','#a24bd1','#e08a00','#0d8fb3','#c2417a'];
  try{var s=localStorage.getItem(KEY); if(s) items=JSON.parse(s)||[];}catch(e){items=[];}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
  function colorFor(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return COLORS[h%COLORS.length];}
  function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
  function dueInfo(due){
    if(!due) return null;
    var p=due.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
    var diff=Math.round((d-today())/86400000);
    var txt=d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
    if(diff<0) return {c:'late',t:'เลยกำหนด '+(-diff)+' วัน ('+txt+')'};
    if(diff===0) return {c:'soon',t:'ส่งวันนี้'};
    if(diff===1) return {c:'soon',t:'ส่งพรุ่งนี้'};
    return {c:'',t:'ส่ง '+txt+' (อีก '+diff+' วัน)'};
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
  function render(){
    var list=document.getElementById('list'); list.textContent='';
    var pending=items.filter(function(i){return !i.done}).length;
    document.getElementById('sum').textContent=items.length?('เหลืออีก '+pending+' งาน จากทั้งหมด '+items.length):'ยังไม่มีการบ้าน';
    var shown=items.filter(function(i){return filter==='all'||(filter==='done')===!!i.done});
    shown.sort(function(a,b){
      if(!!a.done!==!!b.done) return a.done?1:-1;
      return (a.due||'9999').localeCompare(b.due||'9999');
    });
    if(!shown.length){
      list.appendChild(el('li','empty',filter==='done'?'ยังไม่มีงานที่เสร็จ':'ไม่มีการบ้านค้าง กดปุ่ม “เพิ่มการบ้าน” เพื่อจดงานใหม่'));
      list.lastChild.style.cssText='display:block;border:0;background:transparent';
      return;
    }
    shown.forEach(function(it){
      var li=el('li',it.done?'done':''); li.style.setProperty('--subj',colorFor(it.subject||''));
      var chk=el('button','chk',it.done?'✓':''); chk.setAttribute('aria-label',it.done?'ยกเลิกเสร็จ':'ทำเสร็จแล้ว');
      chk.onclick=function(){it.done=!it.done;persist();render();};
      var b=el('div','body');
      if(it.subject) b.appendChild(el('div','subj',it.subject));
      b.appendChild(el('div','t',it.title));
      if(it.note) b.appendChild(el('div','n',it.note));
      var di=it.done?null:dueInfo(it.due);
      if(di) b.appendChild(el('div','due '+di.c,di.t));
      else if(it.due&&it.done) b.appendChild(el('div','due','กำหนดส่ง '+it.due));
      var del=el('button','del','✕'); del.setAttribute('aria-label','ลบ');
      var armed=false,tm;del.onclick=function(){if(!armed){armed=true;del.textContent='ลบ?';del.style.cssText='width:auto;padding:0 12px;background:var(--late);color:#fff;font-weight:700;font-size:16px';tm=setTimeout(function(){armed=false;del.textContent='✕';del.style.cssText='';},3000);return;}clearTimeout(tm);items=items.filter(function(x){return x!==it});persist();render();};
      li.appendChild(chk);li.appendChild(b);li.appendChild(del);list.appendChild(li);
    });
  }
  document.querySelectorAll('.filters button').forEach(function(btn){
    btn.onclick=function(){filter=btn.dataset.f;document.querySelectorAll('.filters button').forEach(function(x){x.setAttribute('aria-pressed',x===btn)});render();};
  });
  var dlg=document.getElementById('dlg');
  document.getElementById('add').onclick=function(){
    ['subj','title','due','note'].forEach(function(id){document.getElementById(id).value='';});
    dlg.showModal(); document.getElementById('subj').focus();
  };
  document.getElementById('cancel').onclick=function(){dlg.close();};
  document.getElementById('save').onclick=function(){
    var title=document.getElementById('title').value.trim();
    if(!title){document.getElementById('title').focus();return;}
    items.push({id:Date.now(),subject:document.getElementById('subj').value.trim(),title:title,due:document.getElementById('due').value,note:document.getElementById('note').value.trim(),done:false});
    persist();dlg.close();render();
  };
  render();
})();
</script>
</body>
</html>
