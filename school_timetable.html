<style>
/* Layout: a departure board on top (now / next, room as a "platform sign"), then a day list or week grid below. */
:root {
  --bg: #E8ECF3;
  --surface: #FFFFFF;
  --surface-2: #F2F5FA;
  --ink: #13203A;
  --muted: #566480;

  --board-muted: #9DB0D0;

  --amber: #FFC63D;
  --tbl: 90%;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1220;
    --surface: #121D33;
    --surface-2: #18253F;
    --ink: #E9EEF8;
    --muted: #93A3C0;
    --line: #243452;
    --now: #E8B000;
    --now-bg: #2B2409;
    --today-col: #1C1A10;
    --board: #17294F;
    --board-2: #1E3466;
    --board-line: #31487C;
    --tbl: 24%;
    --tfl: 84%;

  }
}
:root[data-theme="dark"] {
  --bg: #0A1220;
  --surface: #121D33;
  --surface-2: #18253F;
  --ink: #E9EEF8;
  --muted: #93A3C0;
  --line: #243452;
  --now: #E8B000;
  --now-bg: #2B2409;
  --today-col: #1C1A10;
  --board: #17294F;
  --board-2: #1E3466;
  --board-line: #31487C;
  --tbl: 24%;
  --tfl: 84%;

}

* { box-sizing: border-box; }

  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font: 700 26px/1.15 var(--f-display); text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

/* room sign, used everywhere a room number appears */
.sign {
  flex: none;
  min-width: 62px;
  padding: 5px 10px 6px;
  border-radius: 9px;
  background: var(--board);
  color: var(--amber);
  text-align: center;
  font-family: var(--f-display);
  line-height: 1;
}
.sign small { display: block; margin-bottom: 3px; font: 600 10px/1 var(--f-body); letter-spacing: .12em; color: var(--board-muted); }
.sign b { display: block; font-size: 26px; font-weight: 700; letter-spacing: .02em; }
.sign.txt b { font-size: 15px; line-height: 1.35; padding-block: 4px; }
.sign.sm { min-width: 54px; padding: 4px 8px 5px; }
.sign.sm b { font-size: 20px; }
.sign.sm.txt b { font-size: 13px; }
.board .sign { background: transparent; border: 2px solid var(--amber); }
.board .b-next .sign { border-width: 1.5px; }
.sign.home { background: var(--surface); color: var(--ink); border: 2px solid var(--ink); }

/* board */
.board { background: var(--board); color: var(--board-ink); border-radius: 18px; overflow: hidden; }
.b-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; padding: 14px 16px 0; }
.b-label { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--amber); }
.b-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--board-muted); }
.board.live .b-label i { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.b-clock { font: 600 15px var(--f-display); font-variant-numeric: tabular-nums; }
.b-clock em { font: 400 12px var(--f-body); font-style: normal; color: var(--board-muted); margin-left: 6px; }
.b-now { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 16px 16px; }
.b-text { min-width: 0; overflow-wrap: anywhere; }

.prog { padding: 0 16px 16px; }
.bar { height: 6px; border-radius: 3px; background: var(--board-line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--amber); border-radius: 3px; transition: width .6s ease; }
.prog-t { display: flex; justify-content: space-between; margin-top: 7px; font-size: 13px; color: var(--board-muted); font-variant-numeric: tabular-nums; }
.prog-t b { color: var(--board-ink); font-weight: 600; }
.b-next { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 16px 15px; background: var(--board-2); }
.b-nlabel { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--board-muted); }
.b-next strong { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }
.b-next .meta { display: block; color: var(--board-muted); font-size: 13px; }
.tag { display: inline-block; margin-top: 4px; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; font-size: 11px; font-weight: 600; line-height: 18px; }
.tag.stay { color: var(--muted); }
.tag.move { color: var(--amber); }
.board .tag.stay { color: var(--board-muted); }

/* controls */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(10, 20, 45, .18); }
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.days button { position: relative; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: 600 16px var(--f-display); }
.days button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.days button.is-today::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--now); }

/* day view */
.dayhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.dayhead h2 { margin: 0; display: flex; align-items: center; gap: 8px; font: 700 21px/1.2 var(--f-display); }
.dayhead small { color: var(--muted); font-size: 13px; }
.pill { padding: 0 9px; border-radius: 999px; background: var(--now); color: #1D1400; font: 700 11px/20px var(--f-body); }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.route .lab { margin-right: 2px; font-size: 12px; color: var(--muted); }
.rchip { padding: 2px 9px; border-radius: 7px; background: var(--board); color: var(--amber); font: 600 13px var(--f-display); }
.chev { width: 6px; height: 6px; margin: 0 3px 0 0; border-top: 2px solid var(--muted); border-right: 2px solid var(--muted); transform: rotate(45deg); }
.list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 52px 38px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 66px; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row.is-now { background: var(--now-bg); border-color: var(--now); box-shadow: 0 0 0 1px var(--now); }
.row.is-past, .cell.is-past { opacity: .5; }
.time { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; line-height: 1.25; }
.time .tp { font-size: 11px; color: var(--muted); }
.time b { font: 600 15px var(--f-display); }
.time .tb { font-size: 12px; color: var(--muted); }
.tile { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; font: 700 18px var(--f-display); background: hsl(var(--h) 65% var(--tbl)); color: hsl(var(--h) 55% var(--tfl)); }
.main { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; overflow-wrap: anywhere; }
.name { font-size: 16px; font-weight: 600; line-height: 1.3; }
.meta { font-size: 13px; color: var(--muted); }
.noroom { font-size: 11px; color: var(--muted); text-align: center; max-width: 52px; line-height: 1.3; }
.lunch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; font-weight: 500; }
.lunch.is-now { background: var(--now-bg); border: 1px solid var(--now); color: var(--ink); }
.lunch.is-past { opacity: .5; }
.endrow { padding: 6px 12px; text-align: center; color: var(--muted); font-size: 13px; }

/* week view */
.grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table.week { width: 100%; min-width: 360px; border-collapse: separate; border-spacing: 0; }
.week th, .week td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.week tr:last-child > *, .week th:last-child, .week td:last-child { }
.week td:last-child { border-right: 0; }
.week tbody tr:last-child > * { border-bottom: 0; }
.week thead th { background: var(--surface-2); }
.week th:first-child { position: sticky; left: 0; z-index: 1; width: 46px; background: var(--surface-2); padding: 6px 4px; font-weight: 500; }
.week th:first-child b { display: block; font: 700 15px var(--f-display); }
.week th:first-child span { display: block; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week .corner { font-size: 11px; color: var(--muted); }
.dayh { width: 100%; height: 40px; border: 0; background: transparent; color: var(--ink); font: 600 15px var(--f-display); }
.dayh.is-today { box-shadow: inset 0 -3px 0 var(--now); }
.week td { min-width: 62px; padding: 3px; }
.week td.tcol { background: var(--today-col); }
.cell { display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 46px; padding: 4px 2px; border-radius: 8px; background: hsl(var(--h) 65% var(--tbl)); color: hsl(var(--h) 55% var(--tfl)); }
.cell b { font: 600 12px/1.2 var(--f-display); letter-spacing: .01em; }
.cell span { font: 500 12px/1.2 var(--f-body); opacity: .85; }
.cell.is-now { box-shadow: 0 0 0 2px var(--now); }
.week td.empty { color: var(--muted); }
.week tr.lunchrow td { background: var(--surface-2); color: var(--muted); font-size: 12px; padding: 5px; }
.foot { margin: 4px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 380px) {
  .row { grid-template-columns: 48px 34px minmax(0, 1fr) auto; gap: 10px; padding: 10px; }
  .tile { width: 34px; height: 34px; font-size: 16px; }
  .b-now h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header class="top">

      <h1>ตารางเรียน ม.5/2</h1>

    <div class="sign home"><small>ห้องประจำ</small><b>335</b></div>
  </header>

  <section class="board" id="board"></section>

  <div id="body" style="display:flex;flex-direction:column;gap:14px"></div>

  <p class="foot">คาบ 1 เริ่ม 08.30 · คาบละ 50 นาที · พักกลางวัน 11.50–12.40</p>
</div>

<script>
/*LOGIC-START*/
const START = 8 * 60 + 30, LEN = 50;
const TIMES = (i) => [START + i * LEN, START + (i + 1) * LEN];
const K = (c, t, r, o) => Object.assign({ c: c, t: t, r: r }, o || {});
const LUNCH = { lunch: true };
const GROUP = { 'ค': 'คณิตศาสตร์', 'ท': 'ภาษาไทย', 'อ': 'ภาษาอังกฤษ', 'ว': 'วิทยาศาสตร์', 'ส': 'สังคมศึกษา', 'ง': 'การงานอาชีพ', 'ศ': 'ศิลปะ', 'พ': 'สุขศึกษา-พลศึกษา', 'ก': 'กิจกรรมพัฒนาผู้เรียน', 'I': 'IS' };
const HUE = { 'ค': 220, 'ท': 345, 'อ': 150, 'ว': 275, 'ส': 38, 'ง': 185, 'ศ': 305, 'พ': 95, 'ก': 55, 'I': 8 };
const DAYS = {
  1: [K('ง32102', 'วราภรณ์', '534'), K('ศ32102', 'สภาวดี', '422'), K(null, 'ญาดา', '357', { n: 'ค้นคว้า', s: 'ค้นคว้า', g: 'I' }), K('ค32202', 'วีรวรรณ', '335'), LUNCH, K('พ32102', 'เนตนรินทร์', '534'), K('ท32203', 'นูรีฮัน', 'ห้องสมุด'), K('ก32905', 'เนตนรินทร์', '335'), null],
  2: [K(null, 'เนตนรินทร์', '335', { n: 'โฮมรูม', s: 'โฮมรูม', g: 'ก' }), K('ส32106', 'ฆนรุจ', '429'), K('ว32283', 'สุกกิตติ์', '427'), K('อ32102', 'ญาดา', '357'), LUNCH, K(null, null, 'โรงยิม', { n: 'สุภาพชนฯ ม.4-5', s: 'สุภาพชนฯ', g: 'ก' }), K(null, null, null, { n: 'ชุมนุม', s: 'ชุมนุม', g: 'ก' }), null, null],
  3: [K('อ32102', 'ญาดา', '357'), K('ส32105', 'ฆนรุจ', '332'), K('ค32202', 'วีรวรรณ', '335'), K('ค32202', 'วีรวรรณ', '335'), LUNCH, K('ท32102', 'สุรศักดิ์', '342'), K('ว32104', 'ณภัทร', '323'), K('ว32104', 'ณภัทร', '323'), null],
  4: [K('ส32105', 'ฆนรุจ', '332'), K('ท32102', 'สุรศักดิ์', '342'), K('ค32102', 'ธนภรณ์', '336'), K('ค32102', 'ธนภรณ์', '336'), LUNCH, K('ท32203', 'นูรีฮัน', '544'), K('ค32214', 'สุธีกานต์', '335'), null, null],
  5: [K('อ32204', 'Cris', '357'), K('I32202', 'ฆนรุจ', '344'), K('I32202', 'ฆนรุจ', '344'), K('ว32104', 'ณภัทร', '323'), LUNCH, K('อ32203', 'ญาดา', '357'), K('อ32203', 'ญาดา', '357'), null, null]
};
function lastIdx(p) { for (let i = p.length - 1; i >= 0; i--) if (p[i]) return i; return -1; }
function firstIdx(p) { for (let i = 0; i < p.length; i++) if (p[i] && !p[i].lunch) return i; return -1; }
function getState(dow, m) {
  const p = DAYS[dow];
  if (!p) return { phase: 'off', dow: dow, nextDow: 1 };
  const li = lastIdx(p), end = START + (li + 1) * LEN;
  if (m < START) return { phase: 'before', dow: dow, left: START - m, nextDow: dow, nextIdx: firstIdx(p) };
  if (m >= end) return { phase: 'after', dow: dow, end: end, nextDow: dow === 5 ? 1 : dow + 1 };
  const i = Math.floor((m - START) / LEN);
  const slotEnd = START + (i + 1) * LEN;
  let nj = -1;
  for (let j = i + 1; j <= li; j++) { if (p[j]) { nj = j; break; } }
  return { phase: 'class', dow: dow, i: i, cur: p[i], left: slotEnd - m, frac: (m - (START + i * LEN)) / LEN, slotEnd: slotEnd, nextIdx: nj, nextDow: dow };
}
/*LOGIC-END*/

const THD = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const THS = { 1: 'จ.', 2: 'อ.', 3: 'พ.', 4: 'พฤ.', 5: 'ศ.' };
const MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const pad = (n) => String(n).padStart(2, '0');
const fmtT = (m) => pad(Math.floor(m / 60)) + '.' + pad(Math.round(m) % 60);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtLeft(min) {
  const n = Math.max(1, Math.ceil(min)), h = Math.floor(n / 60), r = n % 60;
  return h ? (r ? h + ' ชม. ' + r + ' นาที' : h + ' ชม.') : n + ' นาที';
}
function bkk() {
  try {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
    const g = (t) => parts.find((x) => x.type === t).value;
    const wd = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[g('weekday')];
    return { dow: wd, day: +g('day'), mon: +g('month'), min: +g('hour') * 60 + +g('minute') + +g('second') / 60 };
  } catch (e) {
    const d = new Date();
    return { dow: d.getDay(), day: d.getDate(), mon: d.getMonth() + 1, min: d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 };
  }
}

const gOf = (e) => e.g || (e.c ? e.c[0] : '');
const nameOf = (e) => e.lunch ? 'พักกลางวัน' : (e.n || GROUP[gOf(e)] || e.c);
const metaOf = (e) => [e.c, e.t].filter(Boolean).join(' · ');
const hueOf = (e) => (HUE[gOf(e)] != null ? HUE[gOf(e)] : 215);
const isNum = (r) => /^\d+$/.test(r);

function signHTML(e, small, cls) {
  if (!e || e.lunch || !e.r) return '';
  const num = isNum(e.r);
  return '<div class="sign' + (small ? ' sm' : '') + (num ? '' : ' txt') + '">' + (num ? '<small>ห้อง</small>' : '') + '<b>' + esc(e.r) + '</b></div>';
}

function nextDayEntry(st, now) {
  const nd = st.nextDow, p = DAYS[nd], idx = firstIdx(p);
  const tomorrow = (now.dow + 1) % 7 === nd;
  const lab = (tomorrow ? 'พรุ่งนี้ วัน' : 'วัน') + THD[nd];
  return { e: p[idx], idx: idx, lab: lab };
}

function nextBlock(label, e, idx, tag) {
  return '<div class="b-next"><div class="b-text"><span class="b-nlabel">' + esc(label) + '</span><strong>' + esc(nameOf(e)) + '</strong>' +
    (metaOf(e) ? '<span class="meta">' + esc(metaOf(e)) + '</span>' : '') + tag + '</div>' + signHTML(e, true) + '</div>';
}

function renderBoard(now) {
  const st = getState(now.dow, now.min);
  const p = DAYS[st.dow];
  let label = '', title = '', sub = '', sign = '', prog = '', next = '', live = false;
  if (st.phase === 'class') {
    live = true;
    const cur = st.cur;
    label = cur && cur.lunch ? 'ตอนนี้ · พักกลางวัน' : 'ตอนนี้ · คาบ ' + (st.i + 1);
    title = cur ? nameOf(cur) : 'คาบว่าง';
    sub = cur && !cur.lunch ? metaOf(cur) : '';
    sign = signHTML(cur, false);
    prog = '<div class="prog"><div class="bar"><span style="width:' + Math.round(st.frac * 100) + '%"></span></div><div class="prog-t"><span>เหลือ <b>' + fmtLeft(st.left) + '</b></span><span>ถึง ' + fmtT(st.slotEnd) + '</span></div></div>';
    if (st.nextIdx >= 0) {
      const e = p[st.nextIdx];
      let tag = '';
      if (cur && !cur.lunch && cur.r && e && !e.lunch && e.r) tag = cur.r === e.r ? '<span class="tag stay">ห้องเดิม</span>' : '<span class="tag move">ย้ายห้อง</span>';
      next = nextBlock('ต่อไป · คาบ ' + (st.nextIdx + 1) + ' · ' + fmtT(TIMES(st.nextIdx)[0]), e, st.nextIdx, tag);
    } else {
      next = '<div class="b-next"><div class="b-text"><span class="b-nlabel">คาบสุดท้ายของวัน</span><strong>เลิกเรียน ' + fmtT(st.slotEnd) + '</strong></div></div>';
    }
  } else if (st.phase === 'before') {
    label = 'ยังไม่เริ่มเรียน';
    title = 'เข้าเรียน ' + fmtT(START);
    sub = 'อีก ' + fmtLeft(st.left);
    const e = p[st.nextIdx];
    next = nextBlock('คาบ ' + (st.nextIdx + 1) + ' · ' + fmtT(TIMES(st.nextIdx)[0]), e, st.nextIdx, '');
  } else {
    const nx = nextDayEntry(st, now);
    if (st.phase === 'after') {
      label = 'เลิกเรียนแล้ว';
      title = 'วันนี้เรียนจบแล้ว';
      sub = 'เลิกเรียน ' + fmtT(st.end);
    } else {
      label = 'วันหยุด';
      title = 'ไม่มีเรียนวัน' + THD[now.dow];
      sub = 'เปิดเรียนวัน' + THD[st.nextDow] + ' ' + fmtT(START);
    }
    next = nextBlock(nx.lab + ' · คาบ ' + (nx.idx + 1) + ' · ' + fmtT(TIMES(nx.idx)[0]), nx.e, nx.idx, '');
  }
  const el = document.getElementById('board');
  el.className = 'board' + (live ? ' live' : '');
  el.innerHTML =
    '<div class="b-head"><span class="b-label"><i></i>' + esc(label) + '</span><span class="b-clock">' + fmtT(Math.floor(now.min)) + '<em>' + esc('วัน' + THD[now.dow] + ' ' + now.day + ' ' + MON[now.mon - 1]) + '</em></span></div>' +
    '<div class="b-now"><div class="b-text"><h2>' + esc(title) + '</h2>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>' + sign + '</div>' +
    prog + next;
}

/* ---------- body: view switch, day tabs, day list, week grid ---------- */
let view = 'day';
let sel = 1;

function routeOf(p) {
  const out = [];
  p.forEach((e) => { if (e && !e.lunch && e.r && out[out.length - 1] !== e.r) out.push(e.r); });
  return out;
}

function rowHTML(d, i, e, p) {
  const t = TIMES(i);
  if (e.lunch) return '<li class="lunch" data-d="' + d + '" data-i="' + i + '"><span>พักกลางวัน</span><span class="tnum">' + fmtT(t[0]) + '–' + fmtT(t[1]) + '</span></li>';
  const prev = p[i - 1];
  const stay = prev && !prev.lunch && prev.r && e.r && prev.r === e.r;
  const room = e.r ? signHTML(e, true) : '<div class="noroom">ไม่ระบุห้อง</div>';
  return '<li class="row" data-d="' + d + '" data-i="' + i + '">' +
    '<div class="time"><span class="tp">คาบ ' + (i + 1) + '</span><b>' + fmtT(t[0]) + '</b><span class="tb">' + fmtT(t[1]) + '</span></div>' +
    '<div class="tile" style="--h:' + hueOf(e) + '">' + esc(gOf(e)) + '</div>' +
    '<div class="main"><div class="name">' + esc(nameOf(e)) + '</div>' + (metaOf(e) ? '<div class="meta">' + esc(metaOf(e)) + '</div>' : '') + (stay ? '<span class="tag stay">ห้องเดิม</span>' : '') + '</div>' +
    room + '</li>';
}

function dayHTML(d, now) {
  const p = DAYS[d];
  const li = lastIdx(p);
  const count = p.filter((e) => e && !e.lunch).length;
  const rt = routeOf(p);
  let h = '<div><div class="dayhead"><h2>วัน' + THD[d] + (d === now.dow ? '<span class="pill">วันนี้</span>' : '') + '</h2><small>' + count + ' คาบเรียน · เลิก ' + fmtT(START + (li + 1) * LEN) + '</small></div>';
  h += '<div class="route"><span class="lab">เส้นทางห้อง</span>';
  rt.forEach((r, k) => { if (k) h += '<span class="chev" aria-hidden="true"></span>'; h += '<span class="rchip">' + esc(r) + '</span>'; });
  h += '</div><ul class="list">';
  for (let i = 0; i <= li; i++) if (p[i]) h += rowHTML(d, i, p[i], p);
  h += '<li class="endrow">เลิกเรียน ' + fmtT(START + (li + 1) * LEN) + '</li></ul></div>';
  return h;
}

function weekHTML(now) {
  let h = '<div class="grid-wrap"><table class="week"><thead><tr><th class="corner">คาบ</th>';
  for (let d = 1; d <= 5; d++) h += '<th><button class="dayh' + (d === now.dow ? ' is-today' : '') + '" data-act="day" data-d="' + d + '" aria-label="ดูวัน' + THD[d] + '">' + THS[d] + '</button></th>';
  h += '</tr></thead><tbody>';
  for (let i = 0; i < 9; i++) {
    const t = TIMES(i);
    const head = '<th scope="row"><b>' + (i + 1) + '</b><span>' + fmtT(t[0]) + '</span></th>';
    if (i === 4) { h += '<tr class="lunchrow">' + head + '<td colspan="5">พักกลางวัน</td></tr>'; continue; }
    h += '<tr>' + head;
    for (let d = 1; d <= 5; d++) {
      const e = DAYS[d][i], tc = d === now.dow ? ' tcol' : '';
      if (!e) h += '<td class="empty' + tc + '"><span>·</span></td>';
      else h += '<td class="' + tc.trim() + '"><div class="cell" data-d="' + d + '" data-i="' + i + '" style="--h:' + hueOf(e) + '"><b>' + esc(e.c || e.s) + '</b><span>' + esc(e.r || '') + '</span></div></td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  return h;
}

function renderBody() {
  const now = bkk();
  let h = '<div class="seg" role="group" aria-label="มุมมอง"><button data-act="view" data-v="day" aria-pressed="' + (view === 'day') + '">รายวัน</button><button data-act="view" data-v="week" aria-pressed="' + (view === 'week') + '">ทั้งสัปดาห์</button></div>';
  if (view === 'day') {
    h += '<div class="days" role="group" aria-label="เลือกวัน">';
    for (let d = 1; d <= 5; d++) h += '<button data-act="day" data-d="' + d + '" class="' + (d === now.dow ? 'is-today' : '') + '" aria-pressed="' + (d === sel) + '" aria-label="วัน' + THD[d] + '">' + THS[d] + '</button>';
    h += '</div>' + dayHTML(sel, now);
  } else {
    h += weekHTML(now);
  }
  document.getElementById('body').innerHTML = h;
  applyNow(now);
}

function applyNow(now) {
  const st = getState(now.dow, now.min);
  const cur = st.phase === 'class' ? st.i : -1;
  document.querySelectorAll('[data-d][data-i]').forEach((el) => {
    const d = +el.dataset.d, i = +el.dataset.i, today = d === now.dow;
    el.classList.toggle('is-now', today && i === cur);
    el.classList.toggle('is-past', today && (st.phase === 'after' || (st.phase === 'class' && i < cur)));
  });
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'view') view = b.dataset.v;
  if (b.dataset.act === 'day') { sel = +b.dataset.d; view = 'day'; }
  renderBody();
});

document.documentElement.lang = 'th';
let lastKey = '', lastDow = -1;
function tick() {
  const now = bkk();
  const key = now.dow + ':' + Math.floor(now.min);
  if (key === lastKey) return;
  lastKey = key;
  if (now.dow !== lastDow) { lastDow = now.dow; renderBody(); }
  renderBoard(now);
  applyNow(now);
}
(function init() {
  const now = bkk(), st = getState(now.dow, now.min);
  sel = (st.phase === 'off' || st.phase === 'after') ? st.nextDow : st.dow;
  tick();
  setInterval(tick, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>

</body></html>
